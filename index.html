<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020202" />
    <title>Jako Welcome Screen</title>
    <style>
      :root {
        color-scheme: dark;
        --safe-x: clamp(2rem, 6vw, 5rem);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #020202;
      }

      body {
        color: #fff;
        font-family: Inter, "SF Pro Display", "SF Pro Text", -apple-system,
          BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        text-rendering: geometricPrecision;
      }

      .welcome-screen {
        position: relative;
        isolation: isolate;
        width: 100vw;
        height: 100vh;
        height: 100svh;
        overflow: hidden;
        background: #020202;
      }

      .background-video,
      .video-shade {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .background-video {
        z-index: -2;
        object-fit: cover;
        object-position: center;
        pointer-events: none;
      }

      .video-shade {
        z-index: -1;
        background:
          linear-gradient(
            180deg,
            rgba(0, 0, 0, 0.54) 0%,
            rgba(0, 0, 0, 0.08) 25%,
            rgba(0, 0, 0, 0.04) 54%,
            rgba(0, 0, 0, 0.74) 100%
          ),
          linear-gradient(90deg, rgba(0, 0, 0, 0.23), transparent 72%);
        pointer-events: none;
      }

      .brand-mark {
        position: absolute;
        top: clamp(0.75rem, 1.8vh, 2rem);
        left: clamp(0.75rem, 1.8vw, 2rem);
        width: clamp(12.5rem, 29vw, 27rem);
        opacity: 0.98;
      }

      .brand-mark img {
        display: block;
        width: 100%;
        height: auto;
        filter: brightness(0) invert(1);
      }

      .greeting {
        position: absolute;
        right: var(--safe-x);
        bottom: clamp(4.5rem, 8vh, 9rem);
        left: var(--safe-x);
        max-width: 88%;
        text-shadow: 0 0.08em 0.45em rgba(0, 0, 0, 0.28);
      }

      .greeting-line,
      .guest-name {
        margin: 0;
      }

      .greeting-line {
        font-size: clamp(1.75rem, 4.3vw, 4.25rem);
        font-weight: 380;
        line-height: 1.1;
        letter-spacing: -0.035em;
        opacity: 0.94;
      }

      .guest-name {
        margin-top: 0.08em;
        font-size: clamp(5.4rem, 14.5vw, 12rem);
        font-weight: 590;
        line-height: 0.92;
        letter-spacing: -0.065em;
      }

      .guest-name.animate {
        animation: name-reveal 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @keyframes name-reveal {
        from {
          opacity: 0;
          filter: blur(0.12em);
          transform: translateY(0.22em);
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: translateY(0);
        }
      }

      @media (orientation: landscape) {
        :root {
          --safe-x: clamp(2rem, 4vw, 5rem);
        }

        .brand-mark {
          width: clamp(11rem, 22vw, 23rem);
        }

        .greeting {
          bottom: clamp(2.5rem, 7vh, 6rem);
        }

        .greeting-line {
          font-size: clamp(1.5rem, 3vw, 3.7rem);
        }

        .guest-name {
          font-size: clamp(4.25rem, 10vw, 9rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .guest-name.animate {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="welcome-screen" aria-label="Jako welcome screen">
      <video
        id="background-video"
        class="background-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        poster="./jako-poster.jpg"
        disablepictureinpicture
        aria-hidden="true"
      >
        <source src="./jako-welcome.mp4" type="video/mp4" />
      </video>

      <div class="video-shade" aria-hidden="true"></div>

      <header class="brand-mark">
        <img src="./jako-logo.png" alt="Jako AI" />
      </header>

      <section class="greeting" aria-live="polite" aria-atomic="true">
        <p class="greeting-line">Welcome to Jako,</p>
        <p id="guest-name" class="guest-name">Omer</p>
      </section>
    </main>

    <script>
      (() => {
        const names = [
          "Omer",
          "Tal",
          "Yoav",
          "Eli",
          "Sveta",
          "Kim",
          "Hila",
          "Eddie",
          "Barak",
        ];

        const shuffle = (items) => {
          const shuffled = [...items];

          for (let index = shuffled.length - 1; index > 0; index -= 1) {
            const randomIndex = Math.floor(Math.random() * (index + 1));
            [shuffled[index], shuffled[randomIndex]] = [
              shuffled[randomIndex],
              shuffled[index],
            ];
          }

          return shuffled;
        };

        const nameOrder = shuffle(names);
        const nameElement = document.getElementById("guest-name");
        const video = document.getElementById("background-video");
        let nameIndex = 0;

        const showName = () => {
          nameElement.textContent = nameOrder[nameIndex];
          nameElement.classList.remove("animate");
          void nameElement.offsetWidth;
          nameElement.classList.add("animate");
        };

        const ensurePlayback = () => {
          video.muted = true;
          const playback = video.play();
          if (playback && typeof playback.catch === "function") {
            playback.catch(() => undefined);
          }
        };

        showName();
        ensurePlayback();

        window.setInterval(() => {
          nameIndex = (nameIndex + 1) % nameOrder.length;
          showName();
        }, 10000);

        video.addEventListener("canplay", ensurePlayback, { once: true });
        window.addEventListener("pageshow", ensurePlayback);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") ensurePlayback();
        });
      })();
    </script>
  </body>
</html>
